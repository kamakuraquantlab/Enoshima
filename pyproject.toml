[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamakuraquantlab-enoshima"
version = "0.1.0"
description = "Kamakura Quant Lab backtest engine for recorded order-book and trade data"
readme = "README.md"
requires-python = ">=3.11"

license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "Kamakura Quant Lab", email = "support@kamakuraquantlab.jp"}]
keywords = ["backtesting", "quantitative-finance", "market-data", "order-book", "trading", "cryptocurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Enoshima is the join between two things that do not know about each other:
# komachi owns the data and answers where it is, qate owns the model and the
# replay machinery. Neither depends on the other; this does, on both.
#
# qate brings no exchange connectivity, so a backtest is offline because the
# library underneath it has no way not to be.
dependencies = [
    "kamakuraquantlab-qate>=0.1",
    "kamakuraquantlab-komachi>=0.7",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Charting results in Grafana. A run writes its results locally either way; see
# enoshima.influx.
influx = [
    "influxdb-client>=1.49",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://kamakuraquantlab.jp"
Source = "https://github.com/kamakuraquantlab/Enoshima"
"The data" = "https://kamakuraquantlab.jp/data/"

[project.scripts]
enoshima = "enoshima.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["enoshima*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned rather than `extend-select`, which inherits ruff's default set. That
# default grew from five families to 414 rules in 0.16, so a version bump silently
# enabled UP, DTZ, TRY, SIM, B, PLR and RET here. Add a family deliberately.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# `example` is on the path so the tests can load the example strategy the same
# way a run does -- by module name, through the strategy loader.
pythonpath = ["src", "."]
testpaths = ["tests"]
