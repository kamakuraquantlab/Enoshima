[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamakuraquantlab-enoshima"
version = "0.1.0"
description = "Kamakura Quant Lab backtest engine for recorded order-book and trade data"
readme = "README.md"
requires-python = ">=3.13"

license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "Kamakura Quant Lab", email = "support@kamakuraquantlab.jp"}]
keywords = ["backtesting", "quantitative-finance", "market-data", "order-book", "trading", "cryptocurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Enoshima asks hase for market data and gets qate objects back; hase asks
# komachi which file holds a market-day. Enoshima never asks komachi directly,
# so komachi is not listed here -- it arrives through hase. qate owns the model
# and the replay machinery and depends on neither. Hase is why Python is 3.13.
#
# qate brings no exchange connectivity, so a backtest is offline because the
# library underneath it has no way not to be. qate-env is the third: the run
# directory a backtest reads its configuration from, which qate deliberately knows
# nothing about. It is also what a live runner reads, which is the point -- "backtest
# what production runs" is one environment read by two processes.
#
# influxdb-client is what an env's "influx" entry records through. It is a
# database client, not a venue client: it cannot reach an exchange.
dependencies = [
    "kamakuraquantlab-qate>=0.4",
    "kamakuraquantlab-qate-env>=0.1",
    "kamakuraquantlab-hase>=0.8",
    "numpy>=2.0",
    "influxdb-client>=1.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://kamakuraquantlab.jp"
Source = "https://github.com/kamakuraquantlab/Enoshima"
"The data" = "https://kamakuraquantlab.jp/data/"

[project.scripts]
# `enoshima.cli`, not a bare `cli`: a top-level module outside the package is
# not installed by `packages.find`, so the command imported whichever `cli`
# some other distribution happened to ship.
enoshima = "enoshima.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["enoshima*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Pinned rather than `extend-select`, which inherits ruff's default set. That
# default grew from five families to 414 rules in 0.16, so a version bump silently
# enabled UP, DTZ, TRY, SIM, B, PLR and RET here. Add a family deliberately.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# `example` is on the path so the tests can load the example strategy the same
# way a run does -- by module name, through the strategy loader.
pythonpath = ["src", "."]
testpaths = ["tests"]
